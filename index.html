<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#078f70">
<title>ZAD | إدارة المطاعم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--green:#078f70;--green2:#e8f6f1;--bg:#f4f8f6;--ink:#20332d;--muted:#84928c;--line:#e4ece8;--white:#fff;--red:#c64c4c;--amber:#b17b26;--shadow:0 8px 28px #173d3010}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{background:white;border:1px solid var(--line);border-radius:22px;padding:30px;width:min(400px,100%);box-shadow:var(--shadow);text-align:center}.logo{width:65px;height:65px;margin:auto;background:var(--green);color:white;border-radius:20px;display:grid;place-items:center;font-size:38px;font-weight:800}.loginbox h1{color:var(--green);margin:8px 0 0}.loginbox p{color:var(--muted);font-size:13px;margin:0 0 20px}.loginbox label{display:block;text-align:right;font-size:12px;margin:12px 0}.loginbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-top:5px}.loginbox button{width:100%;border:0;border-radius:10px;background:var(--green);color:white;padding:12px;font-weight:700}.loginbox small{display:block;color:var(--muted);font-size:10px;margin-top:12px}
#app{min-height:100vh}.sidebar{position:fixed;inset:0 0 0 auto;width:250px;background:white;border-left:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:5}.brand{padding:0 12px 18px;border-bottom:1px solid var(--line);color:var(--green);font-size:25px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.profile{font-size:11px;color:var(--muted);padding:14px 10px}.nav{overflow:auto;flex:1}.nav button{display:block;width:100%;border:0;background:transparent;text-align:right;padding:11px 12px;border-radius:10px;color:#53645e;margin:3px 0;font-size:13px}.nav button.active,.nav button:hover{background:var(--green2);color:var(--green);font-weight:700}.sidebarfoot{display:grid;gap:8px}.sidebarfoot button{padding:10px;border:0;border-radius:10px;background:#f2f6f4;color:#52635d;font-size:12px}.main{margin-right:250px;min-height:100vh}.topbar{height:75px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px;gap:15px;position:sticky;top:0;z-index:3}.topbar h2{font-size:18px;margin:0}.topbar .right{margin-right:auto;color:var(--muted);font-size:11px}.hamb{display:none;border:0;background:var(--green2);padding:8px 10px;border-radius:8px}#view{max-width:1500px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.card small{color:var(--muted);font-size:11px}.card b{display:block;font-size:23px;color:var(--green);margin-top:4px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 14px}.heading h3,.panel h3{font-size:14px;margin:0}.muted{color:var(--muted);font-size:11px}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--green2);color:var(--green);font-size:12px;font-weight:700}.btn.primary{background:var(--green);color:white}.btn.danger{background:#fff0f0;color:var(--red)}.toolbar{display:flex;gap:8px;margin:12px 0}.toolbar input{flex:1}.field,input,select{border:1px solid var(--line);border-radius:9px;padding:10px;background:white;min-width:0}.field{width:100%}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:11px;border-bottom:1px solid var(--line);font-size:11px}th{background:#f8fbf9;color:var(--muted);font-weight:700}.badge{display:inline-block;border-radius:30px;padding:4px 9px;background:var(--green2);color:var(--green);font-size:10px}.badge.warn{background:#fff4df;color:var(--amber)}.badge.red{background:#fff0f0;color:var(--red)}.empty{text-align:center;color:var(--muted);padding:25px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.formgrid label{font-size:11px;color:var(--muted)}.formgrid input,.formgrid select{display:block;width:100%;margin-top:4px}.modalbg{position:fixed;inset:0;background:#10231dcc;z-index:10;display:grid;place-items:center;padding:15px}.modal{width:min(550px,100%);max-height:90vh;overflow:auto;background:white;border-radius:17px;padding:22px}.modal h3{margin:0 0 15px;font-size:16px}.actions{display:flex;gap:8px;margin-top:16px}.posgrid{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.productgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.productbtn{background:white;border:1px solid var(--line);border-radius:11px;padding:13px;text-align:right}.productbtn b{display:block;font-size:12px}.productbtn small{color:var(--green)}.cartline{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.cartline button{border:0;background:#fff0f0;color:var(--red);border-radius:6px}.statusbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.syncnote{font-size:10px;color:var(--muted);padding:8px 10px;background:#f7faf8;border-radius:8px}#toast{position:fixed;bottom:20px;left:20px;background:#163d32;color:white;padding:11px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:20;font-size:12px;pointer-events:none}#toast.show{opacity:1}
@media(max-width:900px){.sidebar{transform:translateX(105%);transition:.2s}.sidebar.open{transform:none}.main{margin:0}.hamb{display:block}.cards{grid-template-columns:repeat(2,1fr)}#view{padding:14px}.topbar{padding:0 14px}.posgrid{grid-template-columns:1fr}.productgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cards{gap:8px}.card{padding:12px}.card b{font-size:18px}.formgrid{grid-template-columns:1fr}.topbar h2{font-size:15px}}
</style>
</head>
<body>
<div id="login" class="login"><form id="loginForm" class="loginbox"><div class="logo">ز</div><h1>ZAD</h1><p>نظام إدارة المطاعم والفروع</p><label>اسم المستخدم<input name="username" value="admin" required></label><label>كلمة المرور<input name="password" type="password" value="1234" required></label><button>دخول</button><small>نسخة تجريبية محلية — بيانات الدخول الافتراضية admin / 1234. غيّرها من الإعدادات قبل الاستخدام.</small><div id="loginError" style="color:#c44;font-size:12px;margin-top:8px"></div></form></div>
<div id="app" class="hidden">
<aside class="sidebar" id="sidebar"><div class="brand">ZAD <small>نظام إدارة المطاعم</small></div><div class="profile" id="profile"></div>
<nav class="nav" id="nav">
<button data-page="dashboard" class="active">▦ لوحة التحكم</button><button data-page="pos">▣ نقطة البيع</button><button data-page="orders">☷ الطلبات والمطبخ</button><button data-page="products">🍔 الأصناف والوصفات</button><button data-page="inventory">⬡ المخزون</button><button data-page="branches">⌂ الفروع</button><button data-page="tables">▤ الطاولات</button><button data-page="suppliers">▧ الموردون</button><button data-page="expenses">− المصروفات</button><button data-page="staff">♙ الموظفون</button><button data-page="reports">▤ التقارير</button><button data-page="settings">⚙ الإعدادات والنسخ الاحتياطي</button>
</nav><div class="sidebarfoot"><button id="exportBtn">تصدير نسخة بيانات JSON</button><button id="logoutBtn">تسجيل الخروج</button></div></aside>
<main class="main"><header class="topbar"><button class="hamb" id="hamb">☰</button><h2 id="pageTitle">لوحة التحكم</h2><span class="right" id="today"></span></header><section id="view"></section></main>
</div><div id="modal"></div><div id="toast"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:2}).format(Number(n)||0), today=()=>new Date().toISOString().slice(0,10);
const KEY='zad_single_file_data_v1', AUTH='zad_single_file_auth';
const defaults=()=>({branches:[{id:1,name:'الفرع الرئيسي',location:'القاهرة',active:true}],products:[{id:1,name:'برجر كلاسيك',category:'وجبات',price:145,cost:72,active:true},{id:2,name:'بطاطس',category:'إضافات',price:55,cost:20,active:true},{id:3,name:'كولا',category:'مشروبات',price:30,cost:12,active:true}],inventory:[{id:1,name:'لحم بقري',unit:'كجم',qty:25,min_qty:8,cost:320,branch_id:1},{id:2,name:'خبز برجر',unit:'قطعة',qty:100,min_qty:20,cost:4,branch_id:1}],recipes:[{product_id:1,inventory_id:1,qty:.15},{product_id:1,inventory_id:2,qty:1}],tables:[{id:1,name:'T01',seats:4,status:'متاحة',branch_id:1}],suppliers:[{id:1,name:'شركة التوريدات',phone:'',balance:0}],expenses:[],orders:[],staff:[{id:1,username:'admin',full_name:'مدير النظام',role:'مدير عام',branch_id:1,password:'1234'}],settings:{restaurant:'ZAD',currency:'EGP'}});
let data;try{data=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{data=defaults()}let currentUser=null,cart=[];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pages={dashboard:'لوحة التحكم',pos:'نقطة البيع',orders:'الطلبات والمطبخ',products:'الأصناف والوصفات',inventory:'المخزون',branches:'الفروع',tables:'الطاولات',suppliers:'الموردون',expenses:'المصروفات',staff:'الموظفون',reports:'التقارير',settings:'الإعدادات والنسخ الاحتياطي'};
function enter(){currentUser={username:$('#loginForm').username.value};$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#profile').textContent='مرحبًا، '+(data.staff.find(x=>x.username===currentUser.username)?.full_name||currentUser.username);$('#today').textContent=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});render('dashboard')}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const f=e.target,u=f.username.value,p=f.password.value,staff=data.staff.find(x=>x.username===u&&x.password===p);if((u==='admin'&&p==='1234')||staff){enter()}else $('#loginError').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'});
$('#logoutBtn').onclick=()=>location.reload();$('#hamb').onclick=()=>$('#sidebar').classList.toggle('open');
$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));$('#sidebar').classList.remove('open');render(b.dataset.page)};
function card(label,value){return `<div class="card"><small>${label}</small><b>${value}</b></div>`}
function panel(title,body){return `<div class="panel"><h3>${title}</h3>${body}</div>`}
function render(page){$('#pageTitle').textContent=pages[page]||page;const fn=views[page];$('#view').innerHTML=fn?fn():'<div class="panel">القسم غير متاح</div>';wire(page)}
const views={
dashboard(){let sales=data.orders.filter(o=>o.status!=='ملغي').reduce((s,o)=>s+o.total,0),expenses=data.expenses.reduce((s,x)=>s+x.amount,0),low=data.inventory.filter(x=>x.qty<=x.min_qty).length;return `<div class="cards">${card('إجمالي المبيعات',money(sales))}${card('عدد الطلبات',data.orders.length)}${card('المصروفات',money(expenses))}${card('أصناف وصلت لحد الطلب',low)}</div>${panel('أداء الفروع',`<div class="scroll"><table><tr><th>الفرع</th><th>المبيعات</th><th>الطلبات</th><th>قيمة المخزون</th></tr>${data.branches.map(b=>{let os=data.orders.filter(o=>o.branch_id===b.id&&o.status!=='ملغي'),v=os.reduce((s,o)=>s+o.total,0),iv=data.inventory.filter(i=>i.branch_id===b.id).reduce((s,i)=>s+i.qty*i.cost,0);return `<tr><td>${esc(b.name)}</td><td>${money(v)}</td><td>${os.length}</td><td>${money(iv)}</td></tr>`}).join('')}</table></div>`)}<p class="syncnote">حفظ البيانات حاليًا على هذا المتصفح والجهاز فقط. مزامنة Google Firebase ستُفعّل بعد إعداد مشروع Firebase وقواعد الأمان.</p>`},
pos(){return `<div class="posgrid"><div class="panel"><div class="heading"><h3>اختيار الأصناف</h3><select id="posBranch">${data.branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><input id="productSearch" class="field" placeholder="ابحث عن صنف..."><div class="productgrid" id="productGrid">${data.products.filter(p=>p.active!==false).map(p=>`<button class="productbtn" data-product="${p.id}"><b>${esc(p.name)}</b><small>${money(p.price)}</small></button>`).join('')}</div></div><div class="panel"><h3>الفاتورة الحالية</h3><div id="cartLines"></div><label class="muted">اسم العميل<input id="customer" class="field" value="عميل نقدي" style="margin:5px 0 10px"></label><label class="muted">طريقة الدفع<select id="payment" class="field" style="margin:5px 0 10px"><option>نقدي</option><option>بطاقة</option><option>محفظة إلكترونية</option></select></label><h3 id="cartTotal">الإجمالي: ${money(0)}</h3><button class="btn primary" id="checkout" style="width:100%;margin-top:10px">تأكيد وحفظ الطلب</button></div></div>`},
orders(){return `<div class="heading"><h3>سجل الطلبات</h3><span class="muted">${data.orders.length} طلب</span></div>${panel('الطلبات',`<div class="scroll"><table><tr><th>رقم</th><th>التاريخ</th><th>الفرع</th><th>العميل</th><th>الإجمالي</th><th>الدفع</th><th>الحالة</th><th>تحديث</th></tr>${data.orders.slice().reverse().map(o=>`<tr><td>#${o.id}</td><td>${o.date}</td><td>${esc(data.branches.find(b=>b.id===o.branch_id)?.name||'')}</td><td>${esc(o.customer)}</td><td>${money(o.total)}</td><td>${esc(o.payment)}</td><td><span class="badge ${o.status==='ملغي'?'red':''}">${o.status}</span></td><td><select data-status="${o.id}">${['قيد التحضير','جاهز','مكتمل','ملغي'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا توجد طلبات حتى الآن</td></tr>'}</table></div>`)}`},
products(){return tablePage('products','الأصناف',['name','category','price','cost','active'],['الاسم','التصنيف','السعر','التكلفة','نشط'])+`<div class="panel"><div class="heading"><h3>وصفات الأصناف (خصم خامات تلقائي عند البيع)</h3><button class="btn" id="recipeAdd">＋ إضافة مكون لوصفة</button></div><div class="scroll"><table><tr><th>الصنف</th><th>الخامة</th><th>الكمية لكل صنف</th></tr>${data.recipes.map(r=>`<tr><td>${esc(data.products.find(p=>p.id===r.product_id)?.name||'')}</td><td>${esc(data.inventory.find(i=>i.id===r.inventory_id)?.name||'')}</td><td>${r.qty}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">لم تتم إضافة وصفات</td></tr>'}</table></div></div>`},
inventory(){return tablePage('inventory','المخزون',['name','unit','qty','min_qty','cost','branch_id'],['اسم الخامة','الوحدة','الرصيد','حد الطلب','تكلفة الوحدة','رقم الفرع'],true)},
branches(){return tablePage('branches','الفروع',['name','location','active'],['اسم الفرع','الموقع','نشط'])},
tables(){return tablePage('tables','الطاولات',['name','seats','status','branch_id'],['الطاولة','عدد المقاعد','الحالة','رقم الفرع'])},
suppliers(){return tablePage('suppliers','الموردون',['name','phone','balance'],['اسم المورد','الهاتف','الرصيد'])},
expenses(){return tablePage('expenses','المصروفات',['title','category','amount','date','branch_id'],['البيان','التصنيف','المبلغ','التاريخ','رقم الفرع'])},
staff(){return tablePage('staff','الموظفون',['username','full_name','role','branch_id'],['اسم المستخدم','الاسم','الدور','رقم الفرع'])},
reports(){let sales=data.orders.filter(o=>o.status!=='ملغي').reduce((s,o)=>s+o.total,0),cost=data.orders.filter(o=>o.status!=='ملغي').reduce((s,o)=>s+o.items.reduce((a,it)=>a+(data.products.find(p=>p.id===it.product_id)?.cost||0)*it.qty,0),0),exp=data.expenses.reduce((s,x)=>s+x.amount,0);return `<div class="cards">${card('المبيعات',money(sales))}${card('تكلفة الأصناف المقدرة',money(cost))}${card('المصروفات',money(exp))}${card('صافي تقديري',money(sales-cost-exp))}</div>${panel('ملخص حسب اليوم',`<div class="scroll"><table><tr><th>التاريخ</th><th>عدد الطلبات</th><th>المبيعات</th></tr>${[...new Set(data.orders.map(o=>o.date))].sort().reverse().map(d=>{let os=data.orders.filter(o=>o.date===d&&o.status!=='ملغي');return `<tr><td>${d}</td><td>${os.length}</td><td>${money(os.reduce((s,o)=>s+o.total,0))}</td></tr>`}).join('')||'<tr><td colspan="3" class="empty">لا توجد بيانات</td></tr>'}</table></div>`)}`},
settings(){return `<div class="panel"><h3>إعدادات المطعم</h3><div class="formgrid" style="margin-top:12px"><label>اسم المطعم<input id="restaurantName" value="${esc(data.settings.restaurant)}"></label><label>عملة النظام<input value="جنيه مصري (EGP)" disabled></label></div><div class="actions"><button class="btn primary" id="saveSettings">حفظ الإعدادات</button></div></div>${panel('النسخ الاحتياطي والاستعادة',`<p class="muted">احتفظ بنسخة JSON بشكل دوري. الاستعادة تستبدل البيانات الحالية بالكامل.</p><div class="actions"><button class="btn primary" id="downloadBackup">تنزيل نسخة احتياطية</button><label class="btn">استعادة نسخة JSON<input type="file" id="restoreFile" accept=".json,application/json" hidden></label><button class="btn danger" id="resetData">إعادة ضبط البيانات التجريبية</button></div>`)}${panel('المزامنة السحابية — Google Firebase',`<p class="muted">هذه النسخة تعمل محليًا حاليًا. يمكن ربطها لاحقًا بـ Firebase Authentication وCloud Firestore من مشروع Google/Firebase. لا تضع مفاتيح سرية أو قواعد Firestore مفتوحة للعامة.</p><span class="badge warn">المزامنة غير مفعّلة بعد</span><p class="syncnote">عند إعداد Firebase سنضيف تسجيل دخول حقيقي وقواعد صلاحيات لكل فرع قبل تشغيل المزامنة.</p>`)}`}}
function tablePage(key,title,fields,labels,low=false){let rows=data[key]||[];return `<div class="heading"><div><h3>${title}</h3><small class="muted">${rows.length} سجل</small></div><button class="btn primary" data-add="${key}">＋ إضافة</button></div>${panel(title,`<div class="toolbar"><input data-search="${key}" placeholder="بحث في ${title}..."></div><div class="scroll"><table id="table-${key}"><tr>${labels.map(x=>`<th>${x}</th>`).join('')}<th>إجراء</th></tr>${rows.map(x=>`<tr>${fields.map(k=>`<td>${k==='active'?(x[k]?'نعم':'لا'):k==='qty'&&low&&x.qty<=x.min_qty?`<span class="badge warn">${x[k]}</span>`:esc(x[k])}</td>`).join('')}<td><button class="btn danger" data-delete="${key}:${x.id}">حذف</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+1}" class="empty">لا توجد بيانات</td></tr>`}</table></div>`)}`}
function modal(title,fields,onSave){$('#modal').innerHTML=`<div class="modalbg"><form class="modal" id="dataForm"><h3>${title}</h3><div class="formgrid">${fields.map(f=>`<label>${f.label}${f.type==='select'?`<select name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}</select>`:`<input name="${f.name}" type="${f.type||'text'}" ${f.step?'step="'+f.step+'"':''} ${f.required===false?'':'required'} ${f.value!==undefined?'value="'+esc(f.value)+'"':''}>`}</label>`).join('')}</div><div class="actions"><button class="btn primary">حفظ</button><button type="button" class="btn" id="cancelModal">إلغاء</button></div></form></div>`;$('#cancelModal').onclick=()=>$('#modal').innerHTML='';$('#dataForm').onsubmit=e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));onSave(obj);$('#modal').innerHTML='';save();render(activePage);toast('تم الحفظ بنجاح')}}
let activePage='dashboard';
function addRecord(key){let defs={
products:[['name','الاسم'],['category','التصنيف'],['price','سعر البيع','number'],['cost','التكلفة','number']],
inventory:[['name','اسم الخامة'],['unit','الوحدة'],['qty','الرصيد','number'],['min_qty','حد الطلب','number'],['cost','تكلفة الوحدة','number'],['branch_id','رقم الفرع','number']],
branches:[['name','اسم الفرع'],['location','الموقع']],
tables:[['name','اسم الطاولة'],['seats','عدد المقاعد','number'],['status','الحالة']],
suppliers:[['name','اسم المورد'],['phone','الهاتف'],['balance','الرصيد','number']],
expenses:[['title','بيان المصروف'],['category','التصنيف'],['amount','المبلغ','number'],['date','التاريخ']],
staff:[['username','اسم المستخدم'],['full_name','الاسم الكامل'],['role','الدور'],['branch_id','رقم الفرع','number'],['password','كلمة المرور','password']]
};let fields=(defs[key]||[]).map(([name,label,type])=>({name,label,type,step:type==='number'?'any':undefined,value:name==='date'?today():undefined}));if(key==='expenses')fields.push({name:'branch_id',label:'رقم الفرع',type:'number',value:1});modal('إضافة '+pages[key],fields,obj=>{obj.id=Math.max(0,...(data[key]||[]).map(x=>x.id||0))+1;for(let k of ['price','cost','qty','min_qty','branch_id','seats','amount','balance'])if(obj[k]!==undefined)obj[k]=Number(obj[k]);if(key==='products')obj.active=true;if(key==='branches')obj.active=true;(data[key]||(data[key]=[])).push(obj)})}
function wire(page){activePage=page;
$('#view').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addRecord(b.dataset.add));
$('#view').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let [k,id]=b.dataset.delete.split(':');if(!confirm('هل تريد حذف هذا السجل؟'))return;data[k]=data[k].filter(x=>x.id!==Number(id));save();render(page);toast('تم الحذف')});
$('#view').querySelectorAll('[data-search]').forEach(inp=>inp.oninput=()=>{let t=$('#table-'+inp.dataset.search);[...t.rows].slice(1).forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(inp.value.toLowerCase()))});
if(page==='pos'){let draw=()=>{let lines=cart.map(x=>`<div class="cartline"><span>${esc(x.name)} × ${x.qty}</span><b>${money(x.price*x.qty)}</b><button data-remove="${x.id}">×</button></div>`).join('')||'<p class="empty">السلة فارغة</p>';$('#cartLines').innerHTML=lines;$('#cartTotal').textContent='الإجمالي: '+money(cart.reduce((s,x)=>s+x.price*x.qty,0));$('#cartLines').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==Number(b.dataset.remove));draw()})};$('#productGrid').onclick=e=>{let b=e.target.closest('[data-product]');if(!b)return;let p=data.products.find(x=>x.id===Number(b.dataset.product)),line=cart.find(x=>x.id===p.id);line?line.qty++:cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});draw()};$('#productSearch').oninput=e=>[...$('#productGrid').children].forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));$('#checkout').onclick=()=>{if(!cart.length)return toast('أضف صنفًا أولًا');let branch=Number($('#posBranch').value),total=cart.reduce((s,x)=>s+x.price*x.qty,0);for(let line of cart){for(let rec of data.recipes.filter(r=>r.product_id===line.id)){let stock=data.inventory.find(i=>i.id===rec.inventory_id&&i.branch_id===branch);if(stock&&stock.qty<rec.qty*line.qty)return toast('المخزون غير كافٍ: '+stock.name)}}for(let line of cart)for(let rec of data.recipes.filter(r=>r.product_id===line.id)){let stock=data.inventory.find(i=>i.id===rec.inventory_id&&i.branch_id===branch);if(stock)stock.qty-=rec.qty*line.qty}data.orders.push({id:Math.max(0,...data.orders.map(o=>o.id))+1,date:today(),branch_id:branch,customer:$('#customer').value,payment:$('#payment').value,total,status:'قيد التحضير',items:cart.map(x=>({product_id:x.id,qty:x.qty,price:x.price}))});cart=[];save();draw();toast('تم تسجيل الطلب وخصم الوصفة من المخزون')}}
if(page==='orders')$('#view').querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>{let o=data.orders.find(x=>x.id===Number(s.dataset.status));if(o){o.status=s.value;save();toast('تم تحديث حالة الطلب')}});
if(page==='products'){$('#recipeAdd').onclick=()=>{if(!data.products.length||!data.inventory.length)return toast('أضف أصنافًا وخامات أولًا');modal('إضافة مكون للوصفة',[{name:'product_id',label:'الصنف',type:'select',options:data.products.map(p=>({value:p.id,label:p.name}))},{name:'inventory_id',label:'الخامة',type:'select',options:data.inventory.map(i=>({value:i.id,label:i.name}))},{name:'qty',label:'كمية المكون لكل صنف',type:'number'}],o=>{data.recipes.push({product_id:Number(o.product_id),inventory_id:Number(o.inventory_id),qty:Number(o.qty)})})}}
if(page==='settings'){$('#saveSettings').onclick=()=>{data.settings.restaurant=$('#restaurantName').value;save();toast('تم حفظ الإعدادات')};$('#downloadBackup').onclick=backup;$('#restoreFile').onchange=restore;$('#resetData').onclick=()=>{if(confirm('سيتم استبدال كل البيانات بالبيانات التجريبية. هل أنت متأكد؟')){data=defaults();save();render('settings');toast('تمت إعادة الضبط')}}}
}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zad-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.products||!d.orders||!d.branches)throw Error();data=d;save();render('settings');toast('تمت استعادة النسخة')}catch{toast('ملف النسخة غير صالح')}};r.readAsText(f)}
$('#exportBtn').onclick=backup;
if(sessionStorage.getItem(AUTH)==='1'){} // لا يتم حفظ جلسة الدخول افتراضيًا
})();
</script>
</body></html>
