<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('ar-EG',{style:'currency',currency:'EGP',maximumFractionDigits:2}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
const SESSION_KEY='sysrmy_session_user';

const GOOGLE_CLIENT_ID='546589135419-i0c847q2emv7j4rsrlfqfg7jgeg2fkif.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive';
const DRIVE_FOLDER_NAME='ZAD Central Data';
const DRIVE_ACCOUNT='mohamedyousryfarha@gmail.com';
const DRIVE_FIELDS='files(id,name,mimeType,modifiedTime,appProperties),nextPageToken';

/* ---------- الصلاحيات ---------- */
const PERM_GROUPS=[
  {group:'لوحة التحكم',items:[['dashboard.view','عرض لوحة التحكم']]},
  {group:'نقطة البيع',items:[['pos.view','عرض نقطة البيع'],['pos.sell','تسجيل طلبات بيع']]},
  {group:'الطلبات والمطبخ',items:[['orders.view','عرض الطلبات'],['orders.update','تغيير حالة الطلب (تحضير / جاهز / مكتمل)'],['orders.cancel','إلغاء الطلبات']]},
  {group:'الأصناف والوصفات',items:[['products.view','عرض الأصناف'],['products.add','إضافة صنف'],['products.edit','تعديل صنف'],['products.delete','حذف صنف'],['products.cost','رؤية تكلفة الصنف'],['recipes.manage','إدارة الوصفات']]},
  {group:'المخزون',items:[['inventory.view','عرض المخزون'],['inventory.add','إضافة خامة'],['inventory.edit','تعديل خامة'],['inventory.delete','حذف خامة'],['inventory.cost','رؤية تكلفة الخامات وقيمة المخزون']]},
  {group:'الفروع',items:[['branches.view','عرض الفروع'],['branches.add','إضافة فرع'],['branches.edit','تعديل فرع'],['branches.delete','حذف فرع']]},
  {group:'الطاولات',items:[['tables.view','عرض الطاولات'],['tables.add','إضافة طاولة'],['tables.edit','تعديل طاولة'],['tables.delete','حذف طاولة']]},
  {group:'الموردون',items:[['suppliers.view','عرض الموردين'],['suppliers.add','إضافة مورد'],['suppliers.edit','تعديل مورد'],['suppliers.delete','حذف مورد']]},
  {group:'المصروفات',items:[['expenses.view','عرض المصروفات'],['expenses.add','إضافة مصروف'],['expenses.edit','تعديل مصروف'],['expenses.delete','حذف مصروف']]},
  {group:'الموظفون',items:[['staff.view','عرض الموظفين'],['staff.add','إضافة موظف'],['staff.edit','تعديل موظف'],['staff.delete','حذف موظف'],['staff.permissions','إدارة صلاحيات الموظفين']]},
  {group:'التقارير',items:[['reports.view','عرض التقارير'],['reports.profit','رؤية الأرباح وصافي التقدير']]},
  {group:'الإعدادات',items:[['settings.view','عرض الإعدادات'],['settings.restaurant','تعديل اسم المطعم'],['settings.backup','تنزيل النسخ الاحتياطية'],['settings.restore','استعادة نسخة احتياطية'],['settings.reset','إعادة ضبط البيانات'],['settings.drive','إدارة ربط Google Drive'],['settings.invoice','تعديل إعدادات الفاتورة والضريبة']]}
];
const ALL_PERMS=PERM_GROUPS.flatMap(g=>g.items.map(i=>i[0]));
const PRESETS={
  'مدير كامل':'ALL',
  'كاشير':['pos.view','pos.sell','orders.view','products.view'],
  'مطبخ':['orders.view','orders.update'],
  'مخزن':['inventory.view','inventory.add','inventory.edit','products.view','recipes.manage'],
  'محاسب':['reports.view','reports.profit','expenses.view','expenses.add','expenses.edit','inventory.cost','orders.view','suppliers.view'],
  'عرض فقط':'VIEW'
};
function presetKeys(name){
  const p=PRESETS[name];
  if(!p)return null;
  if(p==='ALL')return ALL_PERMS;
  if(p==='VIEW')return ALL_PERMS.filter(k=>k.endsWith('.view'));
  return p;
}
function me(){return currentUser?data.staff.find(s=>String(s.id)===String(currentUser.id)):null}
function can(k){
  const u=me();
  if(!u)return false;
  if(u.role==='مدير عام')return true;
  return !!(u.permissions&&u.permissions[k]);
}
function hiddenCol(key,k){
  return (key==='inventory'&&k==='cost'&&!can('inventory.cost'))||(key==='products'&&k==='cost'&&!can('products.cost'));
}

/* ---------- البيانات ---------- */
// كل تفصيلة (صنف، طلب، موظف، ...) = ملف JSON منفصل على Drive باسم coll__id.json
const defaults=()=>({
  branches:[{id:1,name:'الفرع الرئيسي',location:'القاهرة',active:true}],
  products:[
    {id:1,name:'برجر كلاسيك',category:'وجبات',price:145,cost:72,active:true},
    {id:2,name:'بطاطس',category:'إضافات',price:55,cost:20,active:true},
    {id:3,name:'كولا',category:'مشروبات',price:30,cost:12,active:true}
  ],

function newId(){return Date.now()*1000+Math.floor(Math.random()*1000)}

function emptyData(){
  const d=defaults();
  for(const k of Object.keys(d))if(Array.isArray(d[k]))d[k]=[];
  return d;
}

function normalize(d){
  for(const k of Object.keys(d)){
    if(!Array.isArray(d[k]))continue;
    d[k].forEach(r=>{if(r.id===undefined||r.id===null||r.id==='')r.id=newId()});
  }
  if(!Array.isArray(d.staff)||!d.staff.length)d.staff=defaults().staff;
  d.staff.forEach(s=>{if(!s.permissions)s.permissions={}});
  if(!d.settings)d.settings=defaults().settings;
  return d;
}

/* ---------- الوصول للسجلات في الذاكرة ---------- */
function allRecords(){
  const out=new Map();
  for(const [coll,v] of Object.entries(data)){
    if(Array.isArray(v))v.forEach(r=>out.set(coll+'__'+String(r.id),{coll,id:String(r.id),rec:r}));
    else if(coll==='settings')out.set('settings__main',{coll,id:'main',rec:v});
  }
  return out;
}
function setRecord(coll,id,rec){
  if(coll==='settings'){data.settings=rec;return}
  if(!Array.isArray(data[coll]))return;
  const arr=data[coll];
  const i=arr.findIndex(r=>String(r.id)===String(id));
  if(i>=0)arr[i]=rec;else arr.push(rec);
}
function removeRecord(coll,id){
  if(coll==='settings'||!Array.isArray(data[coll]))return;
  data[coll]=data[coll].filter(r=>String(r.id)!==String(id));
}

function localChanges(){
  const cur=allRecords();
  const out=[];
  for(const [key,{coll,id,rec}] of cur){
    const json=JSON.stringify(rec);
    const s=snapshot.get(key);
    if(!s||s.json!==json)out.push({key,coll,id,type:'upsert',rec,json});
  }
  for(const [key,s] of snapshot){
    if(!cur.has(key))out.push({key,coll:s.coll,id:s.id,type:'delete'});
  }
  return out;
}
function hasPending(){return localChanges().length>0}

/* ---------- Google Drive: طلبات أساسية ---------- */
async function driveRequest(url,options={}){
  if(!driveToken)throw new Error('Google Drive غير متصل حاليًا');
  const r=await fetch(url,{...options,headers:{Authorization:'Bearer '+driveToken,...(options.headers||{})}});
  if(r.status===401){driveToken=null;throw new Error('انتهت جلسة Google، جاري التجديد')}
  if(!r.ok){const t=await r.text();throw new Error('Google Drive: '+r.status+' '+t.slice(0,220))}
  return r.status===204?null:r.json();
}

async function findOrCreateFolder(){
  const q="mimeType='application/vnd.google-apps.folder' and name='"+DRIVE_FOLDER_NAME+"' and trashed=false";
  const x=await driveRequest('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name,createdTime)&orderBy=createdTime&pageSize=10');
  if(x.files&&x.files.length)return x.files[0].id;
  const r=await driveRequest('https://www.googleapis.com/drive/v3/files?fields=id',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:DRIVE_FOLDER_NAME,mimeType:'application/vnd.google-apps.folder'})
  });
  return r.id;
}

async function listRemote(){
  const map=new Map();
  let page='';
  do{
    const u='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("'"+driveFolderId+"' in parents and trashed=false")+'&pageSize=1000&fields='+encodeURIComponent(DRIVE_FIELDS)+(page?'&pageToken='+encodeURIComponent(page):'');
    const x=await driveRequest(u);
    for(const f of (x.files||[])){
      const m=f.name.match(/^(.+?)__(.+)\.json$/);
      if(!m)continue;
      const coll=m[1],id=m[2];
      const v=Number(f.appProperties?.zadV||0);
      map.set(coll+'__'+id,{fileId:f.id,coll,id,v});
    }
    page=x.nextPageToken||'';
  }while(page);
  return map;
}

async function downloadRemote(r){
  return driveRequest('https://www.googleapis.com/drive/v3/files/'+r.fileId+'?alt=media');
}

async function uploadRecord(coll,id,json,v,fileId){
  const meta={
    name:coll+'__'+id+'.json',
    mimeType:'application/json',
    appProperties:{zadColl:coll,zadId:String(id),zadV:String(v)}
  };
  if(!fileId)meta.parents=[driveFolderId];
  const boundary='zad_'+Math.random().toString(36).slice(2);
  const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify(meta)+
             '\r\n--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+json+'\r\n--'+boundary+'--';
  const url=fileId
    ?'https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=multipart&fields=id,name'
    :'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name';
  return driveRequest(url,{method:fileId?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});
}

/* ---------- المزامنة لكل تفصيلة ---------- */
async function applyRemote(remote,skipKeys){
  let changed=false;
  for(const [key,r] of remote){
    if(skipKeys.has(key))continue;
    const s=snapshot.get(key);
    if(s&&s.v===r.v)continue;
    const obj=await downloadRemote(r);
    setRecord(r.coll,r.id,obj);
    snapshot.set(key,{json:JSON.stringify(obj),v:r.v,fileId:r.fileId,coll:r.coll,id:r.id});
    changed=true;
  }
  for(const [key,s] of [...snapshot]){
    if(remote.has(key)||skipKeys.has(key))continue;
    removeRecord(s.coll,s.id);
    snapshot.delete(key);
    changed=true;
  }
  return changed;
}

async function refreshOne(r,key){
  const obj=await downloadRemote(r);
  setRecord(r.coll,r.id,obj);
  snapshot.set(key,{json:JSON.stringify(obj),v:r.v,fileId:r.fileId,coll:r.coll,id:r.id});
}

async function pushChanges(remote){
  let conflicts=0;
  for(const c of localChanges()){
    const remoteR=remote.get(c.key);
    const s=snapshot.get(c.key);
    const baseV=s?s.v:0;

    if(c.type==='upsert'){
      if(remoteR&&remoteR.v!==baseV){
        conflicts++;
        await refreshOne(remoteR,c.key);
        continue;
      }
      if(!remoteR&&s){
        conflicts++;
        removeRecord(c.coll,c.id);
        snapshot.delete(c.key);
        continue;
      }
      const newV=baseV+1;
      const res=await uploadRecord(c.coll,c.id,c.json,newV,remoteR?remoteR.fileId:null);
      snapshot.set(c.key,{json:c.json,v:newV,fileId:res.id,coll:c.coll,id:c.id});
      remote.set(c.key,{fileId:res.id,coll:c.coll,id:c.id,v:newV});
    }else{
      if(!remoteR){snapshot.delete(c.key);continue}
      if(remoteR.v!==baseV){
        conflicts++;
        await refreshOne(remoteR,c.key);
        continue;
      }
      await driveRequest('https://www.googleapis.com/drive/v3/files/'+remoteR.fileId,{method:'DELETE'});
      snapshot.delete(c.key);
      remote.delete(c.key);
    }
  }
  return conflicts;
}

function startSync(){
  if(syncTimer)clearInterval(syncTimer);
  syncTimer=setInterval(syncNow,10000);
}

async function syncNow(){
  if(!driveToken){
    if(dataLoaded&&!renewing)requestDrive(false);
    return;
  }
  if(driveBusy||!driveFolderId||!dataLoaded)return;
  driveBusy=true;
  let uiChanged=false,conflicts=0;
  try{
    const remote=await listRemote();
    const pending=new Set(localChanges().map(c=>c.key));
    const pulled=await applyRemote(remote,pending);
    conflicts=await pushChanges(remote);
    uiChanged=pulled||conflicts>0;
    driveStatus='متصل — آخر مزامنة '+new Date().toLocaleTimeString('ar-EG');
    if(conflicts)toast('تعارض في '+conflicts+' سجل: تم تحميل النسخة الأحدث من مستخدم آخر');
  }catch(e){
    driveStatus='تعذرت المزامنة: '+e.message;
    console.error(e);
  }finally{
    driveBusy=false;
    const el=$('#driveStatus');if(el)el.textContent=driveStatus;
  }
  if(uiChanged&&currentUser){
    const fresh=me();
    if(!fresh){logout();return}
    render(activePage);
  }
  if(hasPending())setTimeout(syncNow,1500);
}

async function loadAllFromDrive(){
  snapshot=new Map();
  data=emptyData();
  const remote=await listRemote();
  await applyRemote(remote,new Set());
  if(remote.size===0)data=normalize(defaults());
  else data=normalize(data);
  dataLoaded=true;
  await syncNow();
}

function requestDrive(interactive){
  interactiveRequest=interactive;
  renewing=true;
  let tries=0;
  const go=()=>{
    if(window.google?.accounts?.oauth2){
      try{
        if(!tokenClient){
          tokenClient=google.accounts.oauth2.initTokenClient({
            client_id:GOOGLE_CLIENT_ID,
            scope:DRIVE_SCOPE,
            include_granted_scopes:true,
            callback:onDriveToken,
            error_callback:()=>{
              if(interactiveRequest)showErr('تم إلغاء ربط Google أو تعذّر فتح نافذته');
              onConnectFail();
            }
          });
        }
        tokenClient.requestAccessToken({prompt:interactive?'':'none',hint:DRIVE_ACCOUNT});
      }catch(e){
        showErr('تعذر بدء ربط Google: '+e.message);
        onConnectFail();
      }
    }else if(tries++<50){
      setTimeout(go,100);
    }else{
      if(interactive)showErr('تحميل خدمة Google لم يكتمل. حدّث الصفحة وحاول مرة أخرى.');
      onConnectFail();
    }
  };
  go();
}

async function onDriveToken(resp){
  renewing=false;
  const interactive=interactiveRequest;
  if(resp.error){
    if(interactive)showErr('تعذر ربط Google: '+resp.error);
    onConnectFail();
    return;
  }
  driveToken=resp.access_token;
  try{
    const about=await driveRequest('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)');
    driveEmail=(about.user?.emailAddress||'').toLowerCase();
    if(driveEmail!==DRIVE_ACCOUNT){
      try{google.accounts.oauth2.revoke(driveToken,()=>{})}catch{}
      driveToken=null;
      throw new Error('الحساب المسجّل ('+(driveEmail||'غير معروف')+') مش الحساب المعتمد للنظام');
    }
    driveFolderId=await findOrCreateFolder();
    if(!dataLoaded)await loadAllFromDrive();
    else await syncNow();
    driveStatus='متصل بحساب '+driveEmail;
    startSync();
    $('#driveRenew').classList.add('hidden');
    clearMsg();

    if(currentUser){
      const fresh=me();
      if(!fresh){logout();return}
      render(activePage);
      return;
    }
    const savedUser=sessionUser();
    if(savedUser){enter(savedUser);return}
    showLoginStep();
    if(interactive)showOk('تم ربط Google Drive بنجاح. سجّل دخولك الآن.');
  }catch(e){
    driveToken=null;
    showErr(e.message);
    onConnectFail();
  }
}

function unlinkDrive(){
  if(!confirm('فصل Google Drive من هذا الجهاز وإلغاء الصلاحية؟'))return;
  const tok=driveToken;
  driveToken=null;
  dataLoaded=false;
  if(syncTimer)clearInterval(syncTimer);
  try{if(tok&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(tok)}catch{}
  sessionStorage.removeItem(SESSION_KEY);
  setTimeout(()=>location.reload(),300);
}

/* ---------- الإضافة والتعديل والحذف ---------- */
function modal(title,fields,onSave){
  $('#modal').innerHTML=`<div class="modalbg"><form class="modal" id="dataForm"><h3>${title}</h3>
    <div class="formgrid">${fields.map(f=>`<label>${f.label}${
      f.type==='select'
        ?`<select name="${f.name}" required>${f.options.map(o=>`<option value="${o.value}">${esc(o.label)}</option>`).join('')}</select>`
        :`<input name="${f.name}" type="${f.type||'text'}" ${f.step?'step="'+f.step+'"':''} ${f.required===false?'':'required'} ${f.value!==undefined?'value="'+esc(f.value)+'"':''}>`
    }</label>`).join('')}</div>
    <div class="actions"><button class="btn primary">حفظ</button><button type="button" class="btn" id="cancelModal">إلغاء</button></div>
  </form></div>`;
  $('#cancelModal').onclick=()=>$('#modal').innerHTML='';
  $('#dataForm').onsubmit=e=>{
    e.preventDefault();
    const obj=Object.fromEntries(new FormData(e.target));
    const ok=onSave(obj);
    if(ok===false)return;
    $('#modal').innerHTML='';
    save();
    render(activePage);
    toast('تم الحفظ بنجاح');
  };
}

function recordDefs(){
  return {

    branches:[['name','اسم الفرع'],['location','العنوان'],['phone','رقم الهاتف']],
    tables:[['name','اسم الطاولة'],['seats','عدد المقاعد','number'],['status','الحالة'],['branch_id','رقم الفرع','number']],

    staff:[['username','اسم المستخدم'],['full_name','الاسم الكامل'],['role','الدور'],['branch_id','رقم الفرع','number'],['password','كلمة المرور','password']]
  };

function addRecord(key,rec){
  if(rec?!can(key+'.edit'):!can(key+'.add'))return toast('لا تملك صلاحية لهذا الإجراء');
  const defs=recordDefs()[key]||[];
  const fields=defs.map(([name,label,type])=>({
    name,label,
    type:type==='number'?'number':(type||'text'),
    step:type==='number'?'any':undefined,
    required:!(rec&&name==='password'),
    value:rec
      ?(name==='password'?undefined:rec[name])
      :(name==='date'?today():(name==='branch_id'?1:undefined))
  }));
  modal((rec?'تعديل ':'إضافة ')+pages[key],fields,obj=>{
    for(const k of ['price','cost','qty','min_qty','branch_id','seats','amount','balance'])
      if(obj[k]!==undefined)obj[k]=Number(obj[k]);
    if(key==='staff'){
      if(data.staff.some(s=>s.username===obj.username&&(!rec||s.id!==rec.id))){toast('اسم المستخدم موجود بالفعل');return false}
      if(rec&&!obj.password)obj.password=rec.password;
    }
    if(rec){
      const updated={...rec,...obj,id:rec.id};
      data[key]=data[key].map(x=>x.id===rec.id?updated:x);
    }else{
      obj.id=newId();
      if(key==='products'||key==='branches')obj.active=true;
      if(key==='staff')obj.permissions={};
      (data[key]||(data[key]=[])).push(obj);
    }
  });
}

function savePerms(){

/* ---------- نقطة البيع: منطق الشاشة ---------- */
function wirePos(){
  const grid=$('#productGrid');
  const linesEl=$('#cartLines');
  const cartQty=()=>cart.reduce((s,x)=>s+x.qty,0);
  const cartTotal=()=>cart.reduce((s,x)=>s+x.price*x.qty,0);

  const drawGrid=()=>{
    const q=$('#productSearch').value.trim().toLowerCase();
    const list=data.products.filter(p=>
      p.active!==false &&
      (!posCat||(p.category||'بدون تصنيف')===posCat) &&
      (!q||p.name.toLowerCase().includes(q)));
    grid.innerHTML=list.map(p=>{
      const line=cart.find(x=>x.id===p.id);
      return `<button class="pcard ${line?'inc':''}" type="button" data-product="${p.id}">
        <span class="pname">${esc(p.name)}</span>
        <span class="pcat">${esc(p.category||'')}</span>
        <span class="pprice">${money(p.price)}</span>
        ${line?`<span class="pbadge">${line.qty}</span>`:''}
      </button>`;
    }).join('')||'<p class="empty" style="grid-column:1/-1">لا توجد أصناف مطابقة</p>';
  };

  const drawCart=()=>{
    linesEl.innerHTML=cart.map(x=>`<div class="cline">
        <div class="cname">${esc(x.name)}<small>${money(x.price)} للصنف</small></div>
        <div class="qty"><button type="button" data-dec="${x.id}">−</button><b>${x.qty}</b><button type="button" data-inc="${x.id}">+</button></div>
        <b>${money(x.price*x.qty)}</b>
        <button type="button" class="rm" data-remove="${x.id}">×</button>
      </div>`).join('')||'<p class="empty">الفاتورة فاضية. اختار أصناف من الشاشة.</p>';
    const shown=calcTotals(cartTotal(),getInvCfg()).total;
    $('#cartTotal').textContent=money(shown);
    $('#cartFabTotal').textContent=money(shown);
    $('#cartCount').textContent=cartQty();
    $('#checkout').disabled=!can('pos.sell')||!cart.length;
  };

  const draw=()=>{drawGrid();drawCart()};

  const openCart=v=>{
    $('#cartDrawer').classList.toggle('open',v);
    $('#cartBg').classList.toggle('show',v);
    $('#cartFab').classList.toggle('hide',v);
  };

  $('#productSearch').oninput=drawGrid;

  $('#catTabs').onclick=e=>{
    const b=e.target.closest('[data-cat]');
    if(!b)return;
    posCat=b.dataset.cat;
    $('#catTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));
    drawGrid();
  };

  grid.onclick=e=>{
    const b=e.target.closest('[data-product]');
    if(!b)return;
    const p=data.products.find(x=>x.id===Number(b.dataset.product));
    if(!p)return;
    const line=cart.find(x=>x.id===p.id);
    if(line)line.qty++;
    else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});
    draw();
  };

  linesEl.onclick=e=>{
    const btn=e.target.closest('[data-inc],[data-dec],[data-remove]');
    if(!btn)return;
    const id=Number(btn.dataset.inc??btn.dataset.dec??btn.dataset.remove);
    const line=cart.find(x=>x.id===id);
    if(!line)return;
    if(btn.dataset.inc!==undefined)line.qty++;
    else if(btn.dataset.dec!==undefined){
      line.qty--;
      if(line.qty<1)cart=cart.filter(x=>x.id!==id);
    }else cart=cart.filter(x=>x.id!==id);
    draw();
  };

  $('#cartFab').onclick=()=>openCart(true);
  $('#cartClose').onclick=()=>openCart(false);
  $('#cartBg').onclick=()=>openCart(false);
  $('#cartClear').onclick=()=>{cart=[];draw()};
  $('#cartPrint').onclick=printCart;

  $('#checkout').onclick=()=>{
    if(!can('pos.sell'))return toast('لا تملك صلاحية تسجيل الطلبات');
    if(!cart.length)return toast('أضف صنفًا أولًا');
    const branch=Number($('#posBranch').value);
    const tt=calcTotals(cartTotal(),getInvCfg());

    for(const line of cart){
      for(const rec of data.recipes.filter(r=>r.product_id===line.id)){
        const stock=data.inventory.find(i=>i.id===rec.inventory_id&&i.branch_id===branch);
        if(stock&&stock.qty<rec.qty*line.qty)return toast('المخزون غير كافٍ: '+stock.name);
      }
    }
    for(const line of cart){
      for(const rec of data.recipes.filter(r=>r.product_id===line.id)){
        const stock=data.inventory.find(i=>i.id===rec.inventory_id&&i.branch_id===branch);
        if(stock)stock.qty-=rec.qty*line.qty;
      }
    }
    data.orders.push({
      id:newId(),
      date:today(),branch_id:branch,
      customer:$('#customer').value||'عميل نقدي',
      payment:$('#payment').value,
      total:tt.total,subtotal:tt.net,tax:tt.tax,taxRate:tt.rate,status:'قيد التحضير',createdAt:Date.now(),
      items:cart.map(x=>({product_id:x.id,qty:x.qty,price:x.price}))
    });
    cart=[];
    save();
    draw();
    openCart(false);
    toast('تم تسجيل الطلب وخصم الوصفة من المخزون');
  };

  draw();
}

/* ---------- الفاتورة والضريبة والطباعة ---------- */
const INV_DEFAULTS={
  name:'',title:'فاتورة ضريبية مبسطة',taxNumber:'',commercialReg:'',
  taxEnabled:true,taxRate:14,pricesIncludeTax:false,
  header:'',footer:'شكرًا لزيارتكم — نتمنى رؤيتكم قريبًا',
  paper:'80',showPhone:true,currency:'ج.م'
};

function getInvCfg(){
  const s=data.settings?.invoice||{};
  return {...INV_DEFAULTS,...s,name:s.name||data.settings?.restaurant||'System RMY'};
}

// حساب الضريبة: إضافة فوق السعر، أو الأسعار شاملة الضريبة
function calcTotals(gross,cfg){
  const rate=cfg.taxEnabled?(Number(cfg.taxRate)||0):0;
  const r=x=>Math.round(x*100)/100;
  if(!rate)return {net:r(gross),tax:0,total:r(gross),rate:0};
  if(cfg.pricesIncludeTax){
    const net=gross/(1+rate/100);
    return {net:r(net),tax:r(gross-net),total:r(gross),rate};
  }
  const tax=gross*rate/100;
  return {net:r(gross),tax:r(tax),total:r(gross+tax),rate};
}

function invBody(o,cfg,branch){
  const f=n=>Number(n||0).toFixed(2);
  const d=o.createdAt?new Date(o.createdAt):null;
  const date=d?d.toLocaleDateString('ar-EG'):o.date;
  const time=d?d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
  const rate=o.taxRate??cfg.taxRate;
  const sub=o.subtotal??o.total;
  const tax=o.tax??0;
  const invNo=o.draft?'مسودة':'INV-'+String(o.id).slice(-6);
  const rows=(o.items||[]).map(it=>{
    const p=data.products.find(x=>x.id===it.product_id);
    return `<tr><td>${esc(p?.name||'صنف')}</td><td>${it.qty}</td><td>${f(it.price)}</td><td>${f(it.qty*it.price)}</td></tr>`;
  }).join('');
  return `<div class="inv">
    <div class="c">
      <div class="nm">${esc(cfg.name)}</div>
      ${cfg.header?`<div class="sm">${esc(cfg.header)}</div>`:''}
      ${branch?`<div>${esc(branch.name)}</div>`:''}
      ${branch?.location?`<div class="sm">${esc(branch.location)}</div>`:''}
      ${cfg.showPhone&&branch?.phone?`<div class="sm">هاتف: ${esc(branch.phone)}</div>`:''}
      ${cfg.taxNumber?`<div class="sm">الرقم الضريبي: ${esc(cfg.taxNumber)}</div>`:''}
      ${cfg.commercialReg?`<div class="sm">السجل التجاري: ${esc(cfg.commercialReg)}</div>`:''}
    </div>
    <div class="c ttl">${esc(cfg.title)}</div>
    <div class="r"><span>رقم الفاتورة</span><span>${invNo}</span></div>
    <div class="r"><span>التاريخ</span><span>${date} ${time}</span></div>
    <div class="r"><span>العميل</span><span>${esc(o.customer||'عميل نقدي')}</span></div>
    <hr>
    <table class="it"><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${rows}</table>
    <hr>

/* ---------- الطلبات: المراحل والفلترة والسجل ---------- */
const ORDER_STATUSES=['قيد التحضير','جاهز','مكتمل','ملغي'];

// وقت وصول الطلب لمرحلة معينة (من سجل المراحل)
function stageTime(o,s){
  const e=(o.log||[]).filter(x=>x.s===s).pop();
  if(e)return e.t;
  if(s==='قيد التحضير'&&o.createdAt)return o.createdAt;
  return null;
}
function fmtT(t){return t?new Date(t).toLocaleString('ar-EG',{dateStyle:'short',timeStyle:'short'}):'—'}
function prepMinutes(o){
  const a=o.createdAt,b=stageTime(o,'جاهز');
  return a&&b?Math.max(0,Math.round((b-a)/60000)):null;
}

function filteredOrders(){
  const q=ordHist.q.trim().toLowerCase();
  let from='',to='';
  const now=Date.now(),day=n=>new Date(now-n*86400000).toISOString().slice(0,10);
  if(ordHist.range==='today'){from=to=day(0)}
  else if(ordHist.range==='yesterday'){from=to=day(1)}
  else if(ordHist.range==='week'){from=day(6);to=day(0)}
  else if(ordHist.range==='custom'){from=ordHist.from;to=ordHist.to}
  return data.orders.filter(o=>
    (!from||o.date>=from)&&(!to||o.date<=to)&&
    (!ordHist.branch||String(o.branch_id)===ordHist.branch)&&
    (!ordHist.status||o.status===ordHist.status)&&
    (!q||String(o.id).slice(-6).includes(q)||String(o.customer||'').toLowerCase().includes(q))
  ).sort((a,b)=>(b.createdAt||b.id)-(a.createdAt||a.id));
}

function histSummaryHTML(list){
  const active=list.filter(o=>o.status!=='ملغي');
  const sales=active.reduce((s,o)=>s+o.total,0);
  const mins=list.map(prepMinutes).filter(x=>x!==null);
  const avg=mins.length?Math.round(mins.reduce((a,b)=>a+b,0)/mins.length):null;
  return card('عدد الطلبات',list.length)+card('إجمالي المبيعات',money(sales))+
         card('متوسط وقت التحضير',avg===null?'—':avg+' د')+card('الطلبات الملغاة',list.filter(o=>o.status==='ملغي').length);
}

function histRowsHTML(list){
  const branchName=id=>data.branches.find(b=>b.id===id)?.name||'—';
  const rows=list.slice(0,300).map(o=>{
    const pm=prepMinutes(o);
    const t=o.createdAt?new Date(o.createdAt).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'—';
    const cls=o.status==='ملغي'?'red':(o.status==='مكتمل'?'':'warn');
    return `<tr class="orow" data-detail="${o.id}">
      <td>#${String(o.id).slice(-6)}</td><td>${o.date}</td><td>${t}</td>
      <td>${esc(branchName(o.branch_id))}</td><td>${esc(o.customer)}</td>
      <td>${(o.items||[]).reduce((s,i)=>s+i.qty,0)}</td><td>${money(o.total)}</td>
      <td>${esc(o.payment)}</td><td><span class="badge ${cls}">${esc(o.status)}</span></td>
      <td>${pm===null?'—':pm+' د'}</td></tr>`;
  }).join('');
  return rows||'<tr><td colspan="10" class="empty">لا توجد طلبات مطابقة</td></tr>';
}

// تفاصيل الطلب: خط مراحل بالأوقات + الأصناف + سجل كامل + إجراءات حسب الحالة
function openOrder(id){
  const o=data.orders.find(x=>String(x.id)===String(id));
  if(!o)return;
  const brName=data.branches.find(b=>b.id===o.branch_id)?.name||'—';
  const cur={'قيد التحضير':1,'جاهز':2,'مكتمل':3}[o.status]??-1;
  const steps=[
    ['إنشاء',o.createdAt||null,0],
    ['تحضير',stageTime(o,'قيد التحضير'),1],
    ['جاهز',stageTime(o,'جاهز'),2],
    ['تسليم',stageTime(o,'مكتمل'),3]
  ];
  if(o.status==='ملغي')steps.push(['ملغي',stageTime(o,'ملغي'),4]);
  const stepHTML=steps.map(([name,t,i])=>{
    const done=o.status==='ملغي'?(i===0||i===4):(i<=cur||!!t);
    return `<div class="step ${done?'done':''} ${name==='ملغي'?'cancel':''}"><span class="dot"></span><b>${name}</b><small>${fmtT(t)}</small></div>`;
  }).join('');
  const items=(o.items||[]).map(it=>{
    const p=data.products.find(x=>x.id===it.product_id);
    return `<tr><td>${esc(p?.name||'صنف محذوف')}</td><td>${it.qty}</td><td>${money(it.price)}</td><td>${money(it.qty*it.price)}</td></tr>`;
  }).join('');
  const log=(o.log||[]).map(e=>`<li><b>${esc(e.s)}</b> — ${fmtT(e.t)}</li>`).join('')||'<li class="muted">لا يوجد سجل تفصيلي لهذا الطلب (طلب قديم)</li>';
  const acts=[];
  if(o.status==='قيد التحضير'&&can('orders.update'))acts.push(['جاهز','✓ جاهز','btn primary']);
  if(o.status==='جاهز'&&can('orders.update'))acts.push(['مكتمل','تم التسليم','btn primary']);
  if(o.status!=='ملغي'&&o.status!=='مكتمل'&&can('orders.cancel'))acts.push(['ملغي','إلغاء الطلب','btn danger']);

  $('#modal').innerHTML=`<div class="modalbg" id="ordBg"><div class="modal" style="width:min(640px,100%)">
    <h3>طلب #${String(o.id).slice(-6)} <span class="badge ${o.status==='ملغي'?'red':''}">${esc(o.status)}</span></h3>
    <div class="stepper">${stepHTML}</div>
    <div class="infogrid">
      <div><small>الفرع</small>${esc(brName)}</div>
      <div><small>العميل</small>${esc(o.customer)}</div>
      <div><small>طريقة الدفع</small>${esc(o.payment)}</div>
      <div><small>التاريخ</small>${o.date}</div>
    </div>
    <div class="sec">الأصناف</div>
    <div class="scroll"><table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${items}</table></div>
    <div class="infogrid" style="margin-top:10px"><div><small>قبل الضريبة</small>${money(o.subtotal??o.total)}</div><div><small>الضريبة${o.taxRate?' ('+o.taxRate+'%)':''}</small>${money(o.tax||0)}</div></div>
    <div class="cdTotal" style="margin-top:8px"><span>الإجمالي</span><b>${money(o.total)}</b></div>
    <div class="sec">سجل المراحل</div>
    <ul class="tl">${log}</ul>
    <div class="actions">${acts.map(([to,l,c])=>`<button type="button" class="${c}" data-oact="${to}">${l}</button>`).join('')}<button type="button" class="btn" id="ordPrint">🖨 طباعة الفاتورة</button><button type="button" class="btn" id="ordClose">إغلاق</button></div>
  </div></div>`;
  $('#ordClose').onclick=()=>$('#modal').innerHTML='';
  $('#ordPrint').onclick=()=>printInvoice(o,data.branches.find(b=>b.id===o.branch_id));
  $('#ordBg').onclick=e=>{if(e.target.id==='ordBg')$('#modal').innerHTML=''};
  $('#modal').querySelectorAll('[data-oact]').forEach(b=>b.onclick=()=>{
    $('#modal').innerHTML='';
    setOrderStatus(o.id,b.dataset.oact);
  });
}

// تصدير الطلبات المفلترة لملف CSV (يفتح في Excel)
function exportOrdersCSV(){
  const list=filteredOrders();
  const head=['رقم الطلب','التاريخ','الوقت','الفرع','العميل','الأصناف','الإجمالي','الدفع','الحالة','مدة التحضير (د)'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=list.map(o=>{
    const t=o.createdAt?new Date(o.createdAt).toLocaleTimeString('ar-EG'):'';
    const items=(o.items||[]).map(it=>{const p=data.products.find(x=>x.id===it.product_id);return `${it.qty}x ${p?.name||''}`}).join(' + ');
    const br=data.branches.find(b=>b.id===o.branch_id)?.name||'';
    return [String(o.id).slice(-6),o.date,t,br,o.customer,items,o.total,o.payment,o.status,prepMinutes(o)??''].map(q).join(',');
  });
  const csv='\uFEFF'+[head.map(q).join(','),...lines].join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='orders-'+today()+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('تم تصدير '+list.length+' طلب');
}

    const p=data.products.find(x=>x.id===it.product_id);

  }).join('');

  if(kind==='ready'&&can('orders.update'))acts.push(`<button class="btn primary" type="button" data-next="${o.id}" data-to="مكتمل">تم التسليم</button>`);
  if(kind!=='done'&&can('orders.cancel'))acts.push(`<button class="btn danger" type="button" data-next="${o.id}" data-to="ملغي">إلغاء</button>`);
  return `<div class="ocard ${kind==='prep'&&o.createdAt&&Date.now()-o.createdAt>10*60000?'urgent':''}">

    ${acts.length?`<div class="obtn">${acts.join('')}</div>`:''}
  </div>`;
}

function orderCol(title,list,kind){
  return `<div class="col"><div class="colhead"><span>${title}</span><span class="badge">${list.length}</span></div>`+
    (list.map(o=>orderCard(o,kind)).join('')||'<p class="empty">لا توجد طلبات</p>')+`</div>`;
}

function setOrderStatus(id,to){
  const o=data.orders.find(x=>String(x.id)===String(id));
  if(!o)return;
  if(to==='ملغي'&&!can('orders.cancel'))return toast('لا تملك صلاحية إلغاء الطلبات');
  if(to!=='ملغي'&&!can('orders.update'))return toast('لا تملك صلاحية تغيير الحالة');
  if(to==='ملغي'&&!confirm('إلغاء الطلب؟'))return;
  // لو الطلب اتلغى نرجّع الخامات اللي اتخصمت
  if(to==='ملغي'&&o.status!=='ملغي'){
    for(const it of o.items||[]){
      for(const rec of data.recipes.filter(r=>r.product_id===it.product_id)){
        const st=data.inventory.find(i=>i.id===rec.inventory_id&&i.branch_id===o.branch_id);
        if(st)st.qty+=rec.qty*it.qty;
      }
    }
  }
  o.log=[...(o.log||[]),{s:to,t:Date.now()}];
  o.status=to;
  save();
  render(activePage);
  toast('تم تحديث الطلب: '+to);
}

/* ---------- ربط الأحداث ---------- */
function wire(page){
  const view=$('#view');

  view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addRecord(b.dataset.add));

  view.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{
    const [k,id]=b.dataset.edit.split(':');
    const rec=data[k].find(x=>String(x.id)===id);
    if(rec)addRecord(k,rec);
  });

  view.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{
    const [k,id]=b.dataset.delete.split(':');
    if(!can(k+'.delete'))return toast('لا تملك صلاحية الحذف');
    if(!confirm('هل تريد حذف هذا السجل؟'))return;
    if(k==='staff'&&String(id)===String(currentUser?.id)){toast('لا يمكنك حذف حسابك الحالي');return}
    data[k]=data[k].filter(x=>String(x.id)!==id);
    save();
    render(page);
    toast('تم الحذف');
  });

  view.querySelectorAll('[data-search]').forEach(inp=>inp.oninput=()=>{
    const t=$('#table-'+inp.dataset.search);
    if(!t)return;
    [...t.rows].slice(1).forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(inp.value.toLowerCase()));
  });

  if(page==='pos')wirePos();

  if(page==='orders'){
    view.querySelectorAll('[data-otab]').forEach(b=>b.onclick=()=>{ordersTab=b.dataset.otab;render('orders')});
    view.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>setOrderStatus(b.dataset.next,b.dataset.to));
    view.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{ordHist.range=b.dataset.range;render('orders')});
    $('#hBranch')?.addEventListener('change',e=>{ordHist.branch=e.target.value;refreshHistory()});
    $('#hStatus')?.addEventListener('change',e=>{ordHist.status=e.target.value;refreshHistory()});
    $('#hQ')?.addEventListener('input',e=>{ordHist.q=e.target.value;refreshHistory()});
    $('#hFrom')?.addEventListener('change',e=>{ordHist.from=e.target.value;refreshHistory()});
    $('#hTo')?.addEventListener('change',e=>{ordHist.to=e.target.value;refreshHistory()});
    $('#hExport')?.addEventListener('click',exportOrdersCSV);
    $('#histBody')?.addEventListener('click',e=>{const r=e.target.closest('[data-detail]');if(r)openOrder(r.dataset.detail)});
  }

  if(page==='products'){
    $('#recipeAdd')?.addEventListener('click',()=>{
      if(!data.products.length||!data.inventory.length)return toast('أضف أصنافًا وخامات أولًا');
      modal('إضافة مكون للوصفة',[
        {name:'product_id',label:'الصنف',type:'select',options:data.products.map(p=>({value:p.id,label:p.name}))},
        {name:'inventory_id',label:'الخامة',type:'select',options:data.inventory.map(i=>({value:i.id,label:i.name}))},
        {name:'qty',label:'كمية المكون لكل صنف',type:'number',step:'any'}
      ],o=>{
        data.recipes.push({id:newId(),product_id:Number(o.product_id),inventory_id:Number(o.inventory_id),qty:Number(o.qty)});
      });
    });
  }

  if(page==='staff'){
    view.querySelectorAll('[data-stab]').forEach(b=>b.onclick=()=>{staffTab=b.dataset.stab;render('staff')});
    $('#permUser')?.addEventListener('change',e=>{permUserId=e.target.value;render('staff')});
    $('#permPreset')?.addEventListener('change',e=>{
      const keys=presetKeys(e.target.value);
      if(!keys)return;
      document.querySelectorAll('[data-perm]').forEach(cb=>{if(!cb.disabled)cb.checked=keys.includes(cb.dataset.perm)});
      refreshGroupBoxes();
    });
    view.querySelectorAll('[data-gi]').forEach(gb=>gb.onchange=()=>{
      const g=PERM_GROUPS[Number(gb.dataset.gi)];
      g.items.forEach(([k])=>{const cb=document.querySelector(`[data-perm="${k}"]`);if(cb&&!cb.disabled)cb.checked=gb.checked});
    });
    view.querySelectorAll('[data-perm]').forEach(cb=>cb.onchange=refreshGroupBoxes);
    $('#savePerms')?.addEventListener('click',savePerms);
  }

  if(page==='settings'){
    $('#saveSettings')?.addEventListener('click',()=>{data.settings.restaurant=$('#restaurantName').value;save();toast('تم حفظ الإعدادات')});
    $('#downloadBackup')?.addEventListener('click',backup);
    $('#restoreFile')?.addEventListener('change',restore);
    $('#resetData')?.addEventListener('click',async()=>{
      if(!confirm('سيتم استبدال كل البيانات على Google Drive بالبيانات التجريبية. هل أنت متأكد؟'))return;
      data=normalize(defaults());
      await syncNow();
      toast('تمت إعادة الضبط');
      logout();
    });
    $('#driveReconnect')?.addEventListener('click',()=>requestDrive(true));
    $('#driveSyncNow')?.addEventListener('click',()=>syncNow());
    $('#driveUnlink')?.addEventListener('click',unlinkDrive);
    $('#invForm')?.addEventListener('input',renderInvPreview);
    $('#invSave')?.addEventListener('click',()=>{
      if(!can('settings.invoice'))return toast('لا تملك صلاحية تعديل الفاتورة');
      data.settings.invoice=cfgFromForm();
      save();
      renderInvPreview();
      toast('تم حفظ إعدادات الفاتورة');
    });
    renderInvPreview();
  }
}

/* ---------- النسخ الاحتياطي ---------- */
function backup(){
  if(!can('settings.backup'))return toast('لا تملك صلاحية التنزيل');
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sysrmy-backup-'+today()+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function restore(e){
  if(!can('settings.restore'))return toast('لا تملك صلاحية الاستعادة');
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.products||!d.orders||!d.branches||!d.staff)throw Error('invalid');
      data=normalize(d);
      save();
      render('settings');
      toast('تمت استعادة النسخة');
    }catch{toast('ملف النسخة غير صالح')}
  };
  r.readAsText(f);
}

$('#exportBtn').onclick=backup;

/* ---------- بدء التشغيل: الاتصال بـ Drive أولًا ---------- */
showLoading();
requestDrive(false);
})();
</script>
</body>
</html>
